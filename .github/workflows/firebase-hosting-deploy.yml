# frontend をビルドして Firebase Hosting にデプロイする
# 公開用のこのリポジトリには Secrets を設定していないため、手動実行のみにしている
# （運用中は main へのプッシュで自動デプロイしていた）
# （Firestore のルール・インデックスはデプロイしない）
#
# 必要な Secrets（GitHub リポジトリの Settings → Secrets and variables → Actions）
#   FIREBASE_SERVICE_ACCOUNT : Firebase のサービスアカウント鍵（JSON の中身をそのまま）

name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: festival-escape-v2
          channelId: live
